<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>步进器输入 Demo</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1c1c1e;
      --sub: #8e8e93;
      --accent: #10b981; /* 翠绿，正向激励 */
      --accent-press: #059669;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 16px 60px;
    }
    h1 { font-size: 18px; margin: 4px 0 0; }
    .hint { color: var(--sub); font-size: 13px; max-width: 360px; text-align: center; line-height: 1.6; }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
    }
    .label { font-size: 14px; color: var(--sub); margin-bottom: 14px; }

    .stepper {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      gap: 14px;
      align-items: center;
    }
    .btn {
      flex: 0 0 auto;
      width: 56px;
      height: 56px;             /* ≥ 44pt 触控目标 */
      border-radius: 18px;
      border: none;
      background: #f0f2f5;
      color: var(--accent);
      font-size: 30px;
      font-weight: 500;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform .08s ease, background .15s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(.92);
      background: var(--accent);
      color: #fff;
    }
    .btn:disabled { opacity: .35; }

    .value-wrap {
      width: 100%;
      min-width: 0;
      padding-bottom: 4px;
    }
    .value-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      width: 100%;
      gap: 4px;
    }
    .value {
      width: calc(var(--value-ch, 1) * 1ch);
      min-width: 1ch;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      letter-spacing: -1px;
      /* 关键：隐藏原生加减箭头与滚轮调值 */
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .value::-webkit-outer-spin-button,
    .value::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .unit-sub {
      font-size: 15px;
      font-weight: 500;
      color: var(--sub);
      line-height: 1;
      white-space: nowrap;
      transform: translateY(2px);
    }

    /* ===== 滚轮选择器 wheel picker ===== */
    .picker {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      position: relative;
    }
    /* 中间高亮选中条 */
    .picker::before {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 40px;
      background: rgba(16, 185, 129, .10);
      border-radius: 12px;
      pointer-events: none;
    }
    .wheel {
      --row: 40px;          /* 每行高度 */
      height: calc(var(--row) * 5);   /* 显示 5 行 */
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      text-align: center;
      flex: 0 1 auto;
      /* 上下渐隐 */
      mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
    }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel .pad { height: calc(var(--row) * 2); } /* 头尾留白，使首尾项能滚到中央 */
    .wheel .item {
      height: var(--row);
      line-height: var(--row);
      scroll-snap-align: center;
      font-size: 22px;
      font-weight: 600;
      color: var(--sub);
      transition: color .15s ease, transform .15s ease;
      min-width: 56px;
      padding: 0 6px;
    }
    .wheel .item.active {
      color: var(--accent);
      transform: scale(1.12);
    }
    .picker .sep {
      align-self: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .picker .unit-sub { align-self: center; transform: none; }
  </style>
</head>
<body>
  <h1>移动端步进器输入</h1>
  <p class="hint">
    长按 ＋ / － 可连续加减（先慢后快）。<br />
    点击中间数字会唤起<strong>纯数字键盘</strong>（inputMode="decimal"），<br />
    且<strong>没有</strong>浏览器原生的上下箭头与滚轮调值。
  </p>

  <div class="card">
    <div class="label">今日体重</div>
    <div class="stepper">
      <button class="btn" data-step="-0.1" aria-label="减少">−</button>
      <div class="value-wrap">
        <div class="value-row value-row--short">
          <input
            class="value"
            type="text"
            inputmode="decimal"
            value="4.3"
            data-min="0"
            data-max="20"
            data-decimals="1"
          />
          <span class="unit-sub">kg</span>
        </div>
      </div>
      <button class="btn" data-step="0.1" aria-label="增加">＋</button>
    </div>
  </div>

  <div class="card">
    <div class="label">热量密度</div>
    <div class="stepper">
      <button class="btn" data-step="-10" aria-label="减少">−</button>
      <div class="value-wrap">
        <div class="value-row">
          <input
            class="value"
            type="text"
            inputmode="numeric"
            value="3800"
            data-min="0"
            data-max="9999"
            data-decimals="0"
          />
          <span class="unit-sub">kcal/kg</span>
        </div>
      </div>
      <button class="btn" data-step="10" aria-label="增加">＋</button>
    </div>
  </div>

  <h1 style="margin-top:12px;">滚轮选择器</h1>
  <p class="hint">
    上下滑动滚动到目标值，自动吸附居中（scroll-snap）。<br />
    适合<strong>范围有限、希望快速选定</strong>的场景，整数位 + 小数位分两列。
  </p>

  <div class="card">
    <div class="label">今日体重</div>
    <div class="picker">
      <!-- 整数位 0~20 -->
      <div class="wheel" data-min="0" data-max="20" data-value="4"></div>
      <span class="sep">.</span>
      <!-- 小数位 0~9 -->
      <div class="wheel" data-min="0" data-max="9" data-value="3"></div>
      <span class="unit-sub">kg</span>
    </div>
  </div>

  <script>
    // ===== 滚轮选择器 =====
    document.querySelectorAll('.wheel').forEach((wheel) => {
      const min = parseInt(wheel.dataset.min, 10);
      const max = parseInt(wheel.dataset.max, 10);
      const init = parseInt(wheel.dataset.value, 10);

      // 渲染：头尾留白 + 数字项
      let html = '<div class="pad"></div>';
      for (let n = min; n <= max; n++) html += `<div class="item">${n}</div>`;
      html += '<div class="pad"></div>';
      wheel.innerHTML = html;

      const items = wheel.querySelectorAll('.item');
      const row = parseFloat(getComputedStyle(wheel).getPropertyValue('--row'));

      const highlight = () => {
        const idx = Math.round(wheel.scrollTop / row);
        items.forEach((el, i) => el.classList.toggle('active', i === idx));
        wheel.dataset.value = min + idx;
      };

      // 定位到初始值（不触发动画）
      wheel.scrollTop = (init - min) * row;
      highlight();

      let raf, settleTimer;
      wheel.addEventListener('scroll', () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(highlight);
        // 停止滚动后吸附 + 轻震动
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(6);
        }, 120);
      }, { passive: true });
    });
  </script>

  <script>
    function haptic() {
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function clampFormat(input, raw) {
      const min = parseFloat(input.dataset.min);
      const max = parseFloat(input.dataset.max);
      const dec = parseInt(input.dataset.decimals, 10);
      let v = parseFloat(raw);
      if (isNaN(v)) v = min;
      v = Math.min(max, Math.max(min, v));
      return v.toFixed(dec);
    }

    document.querySelectorAll('.stepper').forEach((stepper) => {
      const input = stepper.querySelector('.value');
      const dec = parseInt(input.dataset.decimals, 10);
      const syncValueWidth = () => {
        input.style.setProperty('--value-ch', Math.max(input.value.length, 1));
      };
      syncValueWidth();

      // 文本框失焦时规整数值
      input.addEventListener('blur', () => {
        input.value = clampFormat(input, input.value);
        syncValueWidth();
      });
      // 只允许数字和小数点
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^\d.]/g, '');
        syncValueWidth();
      });

      stepper.querySelectorAll('.btn').forEach((btn) => {
        const step = parseFloat(btn.dataset.step);
        let timer = null;
        let interval = null;

        const apply = () => {
          const next = (parseFloat(input.value) || 0) + step;
          input.value = clampFormat(input, next);
          syncValueWidth();
          haptic();
        };

        const start = (e) => {
          e.preventDefault();
          apply(); // 单击立即生效
          // 长按 400ms 后开始连增，并逐步加速
          timer = setTimeout(() => {
            let speed = 120;
            const tick = () => {
              apply();
              speed = Math.max(40, speed - 8); // 越按越快
              interval = setTimeout(tick, speed);
            };
            tick();
          }, 400);
        };
        const stop = () => {
          clearTimeout(timer);
          clearTimeout(interval);
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('mousedown', start);
        ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach((ev) =>
          btn.addEventListener(ev, stop)
        );
      });
    });
  </script>
</body>
</html>
